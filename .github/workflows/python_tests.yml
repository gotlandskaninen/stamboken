name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: herdbook
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: herdbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      # Shell tests for scripts/ and the compose files (R071/R072/R097).
      # They need `docker compose config`.
      - name: Run script tests
        run: |
          status=0
          for t in scripts/tests/test-*.sh; do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Build API test image
        run: |
          docker build \
            --target test \
            --tag herdbook-api-test:latest \
            -f .docker/api \
            .

      - name: Run tests in container
        run: |
          docker run \
            --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=herdbook \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=herdbook_test \
            -e FLASK_ENV=testing \
            -e REDIS_URL=redis://localhost:6379/1 \
            -e SECRET_KEY=dev-secret-do-not-use-in-prod \
            -e SESSION_REDIS_URL=redis://localhost:6379/2 \
            -e AUTHCONFIGFILE=/app/tests/auth.ini.test \
            -e CI=true \
            herdbook-api-test:latest \
            pytest /app/tests/ -v --tb=short -n auto
