name: Manual screenshots

# Takes every screenshot in the user manual and the matrikel guide against the
# seeded CI stack, and uploads the ones that changed as an artifact. Run it
# from the Actions tab (Run workflow) before each release tag; a session puts
# the images in a PR. It also runs on a PR that changes the screenshot specs.
# Never against prod or demo: docs/manual/README.md.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/manual-screenshots.yml
      - next-app/e2e/manual/**
      - next-app/playwright.manual-screenshots.config.ts
      - next-app/e2e/fixtures/code_login.py
      - next-app/e2e/fixtures/code-login-rules.ts
      - .github/actions/start-api/**

permissions:
  contents: read

concurrency:
  group: manual-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Manual screenshots
    runs-on: ubuntu-24.04 # same image as the Playwright job, so fonts render alike
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: herdbook
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: herdbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      cms-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: herdbook_cms
          POSTGRES_PASSWORD: herdbook_cms_insecure
          POSTGRES_DB: herdbook_cms
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_INTERNAL_URL: http://localhost:9090
      CMS_DATABASE_URL: postgres://herdbook_cms:herdbook_cms_insecure@localhost:5433/herdbook_cms
      MANUAL_BASE_URL: http://localhost:8080
      # The same litter every run (mutation-manual-flows.spec.ts).
      MANUAL_FLOW_SLOT: '0'

    steps:
      - uses: actions/checkout@v6

      # Code login on, as in production: the login screenshots need it.
      - uses: ./.github/actions/start-api
        env:
          KODINLOGGNING: 'true'
          SJALVSKAPAT_KONTO_PROD: 'true'
          NEXT_INTERNAL_ORIGIN: http://localhost:3000
          MAIL_MODE: log
          LINK_SECRET: code-login-e2e-fixture

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: next-app

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('next-app/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: next-app

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: next-app

      - name: Publish the account rules in the test CMS
        run: pnpm exec payload run e2e/fixtures/code-login-rules.ts
        working-directory: next-app
        env:
          KONTOREGLER_TITEL: Regler för ditt konto
          KONTOREGLER_TEXT: Exempeltext i testmiljön. Reglerna som gäller står på gotlandskaninen.se/kontoregler.

      # Next and the API on one origin, as nginx serves them in production
      # (the genetics page needs its trailing slashes kept).
      - name: Start Next and a proxy in front of it
        run: |
          nohup pnpm dev > "$RUNNER_TEMP/next.log" 2>&1 &
          cat > "$RUNNER_TEMP/proxy.conf" <<'EOF'
          map $http_upgrade $connection_upgrade { default upgrade; '' close; }
          server {
            listen 8080;
            location /api/ { proxy_pass http://127.0.0.1:9090; proxy_set_header Host $http_host; }
            # The dev server's websocket: without it the pages never hydrate.
            location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_set_header Host $http_host;
            }
          }
          EOF
          docker run -d --name manual-proxy --network host \
            -v "$RUNNER_TEMP/proxy.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.29-alpine
          timeout 180 bash -c 'until curl -sf -o /dev/null http://localhost:8080/auth/sign-in; do sleep 3; done'
        working-directory: next-app

      # The kullista and the certificate the screenshots show.
      - name: Run the manual's flows
        run: pnpm exec playwright test --config=playwright.config.ts --project=mutation-tests --retries=0 e2e/manual/mutation-manual-flows.spec.ts
        working-directory: next-app

      - name: Take the manual's screenshots
        run: |
          MANUAL_CERT_UUID=$(PGPASSWORD=testpass psql -h localhost -U herdbook herdbook_test -tAc \
            "select verification_token from digitalcertificatev2 where is_current order by id desc limit 1")
          [ -n "$MANUAL_CERT_UUID" ] || { echo "::error::The flows issued no certificate"; exit 1; }
          export MANUAL_CERT_UUID
          pnpm exec playwright test --config playwright.manual-screenshots.config.ts --project=manual --update-snapshots=changed --reporter=line --output=test-results/manual
        working-directory: next-app

      - name: Take the matrikel guide's screenshots
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --config playwright.manual-screenshots.config.ts --project=guide --update-snapshots=changed --reporter=line --output=test-results/guide
        working-directory: next-app

      # The list of changed images is also the list of sections to reread.
      # Last, so its herd and membership are in no other picture.
      - name: Take the code login's screenshots
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --config playwright.manual-screenshots.config.ts --project=login --update-snapshots=changed --reporter=line --output=test-results/login
        working-directory: next-app

      - name: List changed images
        if: ${{ !cancelled() }}
        run: |
          dirs=(next-app/public/stamboken/manual next-app/content/matrikel-guide)
          mapfile -t changed < <(git -c core.quotePath=false status --porcelain --untracked-files=all -- "${dirs[@]}" | awk '/\.png$/ {print $2}')
          {
            echo "## Skärmbilder som ändrats (${#changed[@]})"
            [ ${#changed[@]} -eq 0 ] || printf -- "- \`%s\`\n" "${changed[@]}"
            echo
            echo "Läs om avsnitten som visar dem. Hämta bilderna under Artifacts (manual-screenshots)."
            for dir in "${dirs[@]}"; do
              doc=$(ls "$dir"/*.md)
              grep -oE '\]\([^)[:space:]]+\.png\)' "$doc" | sed -E 's/^\]\(//; s/\)$//' | sort -u |
                while read -r png; do
                  [ -f "$dir/$png" ] || echo "- Saknas: \`$dir/$png\` (står i $(basename "$doc"))"
                done
            done
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/bilder"
          for f in "${changed[@]}"; do install -D "$f" "$RUNNER_TEMP/bilder/$f"; done

      # Only a green run: a failed test leaves its old picture unnamed.
      - name: Upload changed images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manual-screenshots
          path: ${{ runner.temp }}/bilder/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test report and Next log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manual-screenshots-report
          path: |
            next-app/playwright-report/
            next-app/test-results/
            ${{ runner.temp }}/next.log
          retention-days: 14

      - name: Stop API and proxy
        if: always()
        run: docker rm -f test-api manual-proxy 2>/dev/null || true
