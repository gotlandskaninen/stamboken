name: Lint Code Base

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Only include linters we want (v8 doesn't allow mixing true/false)
          # JS/TS disabled: super-linter lacks Next.js deps, ESLint runs locally via 'pnpm lint' and pre-commit hook
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_BASH: true
          VALIDATE_MARKDOWN: true

      - name: UI terms
        run: scripts/check-ui-terms.sh

      - name: Manual coverage
        run: scripts/check-manual-coverage.sh
      - name: ADR code references exist
        run: python3 scripts/check-adr-refs.py
      - name: No symlinks in git
        run: scripts/check-no-symlinks.sh
      - name: Compose files keep dev and demo away from production data
        run: scripts/tests/test-compose-isolation.sh
