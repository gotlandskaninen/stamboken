# The yearly report's personal link (step 3): $log_uri hides everything after /rapport/ (and the exchange's
# /api/v2/rapport/oppna/) in the access log. $uri is decoded, so %72apport and the rewritten path are hidden too (R6).
map $uri $rapport_hidden {
    default 0;
    ~^/rapport/ 1;
    ~^/api/v2/rapport/oppna/ 1;
}
map $rapport_hidden $log_uri {
    default $request_uri;
    1 "/rapport/***";
}
log_format rapport_masked '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    # Listen to port 443 on both IPv4 and IPv6.
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    server_name localhost;

    ssl_certificate /etc/letsencrypt/live/localhost/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;

    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;
    
    # Serve uploaded files directly
    location /uppladdningar/ {
        alias /app/uppladdningar/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ----------------------------------------
    # /rapport/<token> → Flask exchange (step 3). Flask checks the token and answers 303 to /rapport?kod=<id>, so
    # Next never sees it. Every path under /rapport/ but /rapport/ogiltig goes there: a link a mail client broke
    # gets the page with phone numbers, not a 404 (FA6). The error log is dropped for the location because it
    # quotes the request line and the upstream URI (R6b); the access log uses $log_uri.
    # ----------------------------------------
    location = /rapport/ogiltig {
        proxy_pass http://next-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/rapport/ {
        access_log /var/log/nginx/access.log rapport_masked;
        error_log /dev/null crit;
        rewrite ^/rapport/(.*)$ /api/v2/rapport/oppna/$1 break;
        proxy_pass http://api:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
    }

    # The exchange is reached through /rapport/ only: a direct request would put the token in the access log.
    location ^~ /api/v2/rapport/oppna/ {
        return 404;
    }

    # Proxy requests to the Flask API
    location /api/ {
        proxy_pass http://api:9090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://next-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
