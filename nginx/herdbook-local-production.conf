# Nginx config för lokal produktionsliknande miljö
#
# Speglar produktions-routing med standard-portar (80/443)
# så att Google OAuth fungerar.
#
# Domänstruktur (speglar produktion):
#
# localhost = gotlandskaninen.se (primär domän):
#   /              → Next.js (landing page + CMS-sidor)
#   /stamboken/    → Next.js (herdbook dashboard, auth required)
#   /admin         → Next.js (Payload CMS admin)
#   /cms-api/      → Next.js (Payload REST API)
#   /api/          → Flask API (prod-databas: herdbook)
#   /api-test/     → Flask API (test-databas: herdbook_demo)
#
# stamboken.localhost = stamboken.gotlandskaninen.se (legacy):
#   /              → Legacy frontend (prod)
#   /api/          → Flask API (prod-databas: herdbook)
#
# test.localhost = test.gotlandskaninen.se (legacy test):
#   /              → Legacy frontend (test)
#   /api/          → Flask API (test-databas: herdbook_demo)

upstream api_prod {
    server api:9090;
    keepalive 32;
}

upstream api_test {
    server api-test:9090;
    keepalive 32;
}

upstream nextjs {
    server next-app:3000;
    keepalive 32;
}

# CSP reports from the legacy vhosts (location = /csp-report) are logged as
# one JSON line each, without client IP or user agent.
log_format csp_report escape=json '{"time":"$time_iso8601","host":"$host","report":"$request_body"}';
limit_req_zone $binary_remote_addr zone=csp_report:1m rate=10r/m;

# Sink for /csp-report (loopback only, not a public vhost): nginx only fills
# $request_body for a proxied request.
server {
    listen 127.0.0.1:8099;
    access_log off;
    return 204;
}

server {
    listen 80;
    server_name localhost stamboken.localhost test.localhost
                dev.gotlandskaninen.se stamboken.dev.gotlandskaninen.se test.dev.gotlandskaninen.se;
    return 301 https://$host$request_uri;
}

# ==============================================
# localhost — speglar gotlandskaninen.se (primär)
#
# Next.js är catch-all. CMS-sidor, dashboard, admin
# och Payload API — allt serveras av Next.js.
# ==============================================
server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    # dev.gotlandskaninen.se-aliasen finns för Google OAuth: Google avvisar
    # redirect-URI:er på *.localhost (ej publik TLD), men accepterar
    # subdomäner till den redan auktoriserade domänen. Peka namnen på
    # 127.0.0.1 i /etc/hosts och registrera callback-URL:erna i Google Console.
    server_name localhost dev.gotlandskaninen.se;

    ssl_certificate /etc/letsencrypt/live/localhost/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ----------------------------------------
    # /api/ → Flask API (prod-databas)
    # ----------------------------------------
    location /api/ {
        proxy_pass http://api_prod/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /api-test/ → Flask API (test-databas)
    # ----------------------------------------
    location /api-test/ {
        proxy_pass http://api_test/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /stamboken/ → Next.js (herdbook dashboard)
    # ----------------------------------------
    location /stamboken/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ----------------------------------------
    # /admin → Next.js (Payload CMS admin)
    # ----------------------------------------
    location /admin {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /cms-api/ → Next.js (Payload REST API)
    # ----------------------------------------
    location /cms-api/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------
    # Bare /v2 and /stamboken (no trailing slash) → dashboard
    # ----------------------------------------
    location = /v2 {
        return 301 https://$host/stamboken/;
    }
    location = /stamboken {
        return 301 https://$host/stamboken/;
    }

    # ----------------------------------------
    # /v2/* → /stamboken/* (redirect old URLs)
    # ----------------------------------------
    location ~ ^/v2/(.*)$ {
        return 301 https://$host/stamboken/$1;
    }

    # ----------------------------------------
    # /uppladdningar/ → Statiska filer (kaninfoton + CMS media)
    # ----------------------------------------
    location /uppladdningar/ {
        alias /app/uppladdningar/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ----------------------------------------
    # / → Next.js (catch-all: CMS-sidor, dashboard, admin, Payload API)
    # ----------------------------------------
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================
# stamboken.localhost — speglar stamboken.gotlandskaninen.se (legacy)
#
# Legacy React SPA med Flask API.
# Samma certifikat som localhost (lokal CA).
# ==============================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name stamboken.localhost stamboken.dev.gotlandskaninen.se;

    ssl_certificate /etc/letsencrypt/live/localhost/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ----------------------------------------
    # /api/ → Flask API (prod-databas)
    # ----------------------------------------
    location /api/ {
        proxy_pass http://api_prod/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # CSP violation reports from the legacy SPA (see log_format csp_report)
    location = /csp-report {
        limit_except POST { deny all; }
        limit_req zone=csp_report burst=20 nodelay;
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        access_log /var/log/nginx/access.log csp_report;
        proxy_pass http://127.0.0.1:8099;
    }

    # ----------------------------------------
    # / → Legacy frontend (prod)
    # ----------------------------------------
    location / {
        root /etc/nginx/legacy-frontend-prod;
        try_files $uri $uri/ /index.html;

        # add_header here replaces the server-level set, so it is repeated in full.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests; report-uri /csp-report" always;
        add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; report-uri /csp-report" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            # No add_header here: it would drop the headers set in location /.
        }
    }
}

