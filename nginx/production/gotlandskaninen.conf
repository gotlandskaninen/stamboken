# ============================================
# gotlandskaninen.se - the association's public site and Stamboken Online
#
# Own file so that its certificate order cannot fail the others. Until the DNS
# for the host points here there is no certificate, and jonasal/nginx-certbot
# sets this file aside (.nokey) at start; the other hosts are not affected.
# After the DNS switch:
#   export COMPOSE_FILE=docker-compose.production.yml
#   ./scripts/ensure-nginx-certs.sh nginx/production/gotlandskaninen.conf
#   docker compose restart nginx
# www.gotlandskaninen.se has its own file, gotlandskaninen-www.conf, so that
# a missing www certificate does not take this host down.
#
# The server block is the sb.gotlandskaninen.se block in
# herdbook-production.conf with another name: same locations, no noindex
# header, HSTS, redirects to a fixed host name, and the three addresses of the
# former site that have moved. Change the two together until sb is retired.
# Uses the upstreams in herdbook-production.conf.
# ============================================
server {
    listen 443 ssl;
    server_name gotlandskaninen.se;

    ssl_certificate /etc/letsencrypt/live/gotlandskaninen.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gotlandskaninen.se/privkey.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Allow CMS media uploads (Payload admin) up to 10 MB.
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # No includeSubDomains: other hosts under the domain are served elsewhere.
    # One day for the first week on this address, so a mistake is quick to
    # undo; then raise it to a year (max-age=31536000).
    add_header Strict-Transport-Security "max-age=86400" always;
    # The API sets its own HSTS, a year with includeSubDomains. Passed on from
    # this host it would cover every host under the domain.
    proxy_hide_header Strict-Transport-Security;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Addresses of the former site (Google Sites, until November 2026) that
    # have another name here. The other seven are unchanged.
    location = /hem {
        return 301 https://gotlandskaninen.se/;
    }
    location = /föreningen {
        return 301 https://gotlandskaninen.se/foreningen;
    }
    location = /styrelse-kontakt {
        return 301 https://gotlandskaninen.se/kontakt;
    }

    # The QR code on a v1 digital certificate points at HERDBOOK_HOST +
    # /individual/<number>/verify, and only the legacy app answers that.
    location ~ ^/individual/[^/]+/verify$ {
        return 301 https://stamboken.gotlandskaninen.se$request_uri;
    }

    # ----------------------------------------
    # /api/ → Flask API (prod-databas)
    # ----------------------------------------
    location /api/ {
        proxy_pass http://api_prod/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authoritative for is_legacy_host(): ProxyFix trusts one
        # forwarded host, so a client-supplied X-Forwarded-Host would
        # otherwise pick the legacy/v2 compatibility branch.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /api-test/ → Flask API (test-databas)
    # För Next.js frontend att växla till test-läge
    # ----------------------------------------
    location /api-test/ {
        proxy_pass http://api_test/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authoritative for is_legacy_host(): ProxyFix trusts one
        # forwarded host, so a client-supplied X-Forwarded-Host would
        # otherwise pick the legacy/v2 compatibility branch.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /stamboken/ → Next.js (herdbook dashboard)
    # ----------------------------------------
    location /stamboken/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ----------------------------------------
    # /admin → Next.js (Payload CMS admin)
    # ----------------------------------------
    location /admin {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Payload admin streams RSC/Suspense; buffering can blank the panel.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /cms-api/ → Next.js (Payload REST API)
    # ----------------------------------------
    location /cms-api/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bare /v2 and /stamboken → the dashboard's start page. There is no page
    # at /stamboken, and Next sends /stamboken/ back to /stamboken: a 301 to
    # /stamboken/ here looped (the banner link in the old UI, 2026-11-23).
    location = /v2 {
        return 302 https://gotlandskaninen.se/stamboken/min-besattning;
    }
    location = /stamboken {
        return 302 https://gotlandskaninen.se/stamboken/min-besattning;
    }

    # The old manifest's start_url "." is /static/, so icons installed from it
    # open there. Next sends /static/ to /static, and the /static/ location
    # below sends /static back to /static/: a loop (#220). Exact matches stop
    # both before they reach either.
    location = /static {
        return 302 https://gotlandskaninen.se/stamboken/min-besattning;
    }
    location = /static/ {
        return 302 https://gotlandskaninen.se/stamboken/min-besattning;
    }

    # /v2/* → /stamboken/* (redirect old URLs)
    location ~ ^/v2/(.*)$ {
        return 301 https://gotlandskaninen.se/stamboken/$1;
    }

    # Optimized images: the URL is built from the source path, not a content
    # hash, so a replaced image keeps its URL. Pass Next's own header through
    # (max-age 4 h, must-revalidate) instead of the immutable year below.
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Next.js static files (content-hashed names)
    location /_next/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js public folder images
    location /static/ {
        proxy_pass http://nextjs/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ----------------------------------------
    # /uppladdningar/ → Statiska filer
    # ----------------------------------------
    # Signed certificate PDFs are served only by the API, with its access check.
    location ^~ /uppladdningar/certifikat/ {
        return 404;
    }
    location /uppladdningar/ {
        alias /app/uppladdningar/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ----------------------------------------
    # / → Next.js (public CMS site + landing)
    # The legacy SPA has its own hosts, see stamboken-legacy.conf.
    # ----------------------------------------
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
