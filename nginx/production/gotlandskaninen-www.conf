# ============================================
# www.gotlandskaninen.se → gotlandskaninen.se
#
# Own file, for the same reason as gotlandskaninen.conf: without its
# certificate only this file is set aside. After the DNS switch:
#   export COMPOSE_FILE=docker-compose.production.yml
#   ./scripts/ensure-nginx-certs.sh nginx/production/gotlandskaninen-www.conf
#   docker compose restart nginx
# ============================================
# Path and query kept.
server {
    listen 443 ssl;
    server_name www.gotlandskaninen.se;

    ssl_certificate /etc/letsencrypt/live/www.gotlandskaninen.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gotlandskaninen.se/privkey.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://gotlandskaninen.se$request_uri;
}
