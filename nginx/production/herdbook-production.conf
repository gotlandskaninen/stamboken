# Nginx config för Gotlandskanin produktion
#
# Domäner:
#   - sb.gotlandskaninen.se     (prod legacy + Next.js)
#   - test.gotlandskaninen.se   (test legacy mot test-db)
#
# SSL-certifikat hanteras automatiskt av nginx-certbot (jonasal/nginx-certbot).
# Port 80 redirect + ACME-challenges sköts av imagens inbyggda redirector.conf.
# Lägg BARA till listen 443 server blocks här.
#
# TODO: Lägg till stamboken.gotlandskaninen.se när DNS är flyttad hit.

upstream api_prod {
    server api:9090;
    keepalive 32;
}

upstream api_test {
    server api-test:9090;
    keepalive 32;
}

upstream nextjs {
    server next-app:3000;
    keepalive 32;
}

# CSP reports from the legacy vhosts (location = /csp-report) are logged as
# one JSON line each, without client IP or user agent.
log_format csp_report escape=json '{"time":"$time_iso8601","host":"$host","report":"$request_body"}';
limit_req_zone $binary_remote_addr zone=csp_report:1m rate=10r/m;

# Sink for /csp-report (loopback only, not a public vhost): nginx only fills
# $request_body for a proxied request.
server {
    listen 127.0.0.1:8099;
    access_log off;
    return 204;
}

# ============================================
# sb.gotlandskaninen.se - PRODUKTION
# (temporärt namn under migrering, byt till stamboken.* när DNS är flyttad)
# ============================================
server {
    listen 443 ssl;
    server_name sb.gotlandskaninen.se;

    ssl_certificate /etc/letsencrypt/live/sb.gotlandskaninen.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sb.gotlandskaninen.se/privkey.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    # Allow CMS media uploads (Payload admin) up to 10 MB.
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Transitional staging host - keep out of search indexes until the apex flip.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ----------------------------------------
    # /api/ → Flask API (prod-databas)
    # ----------------------------------------
    location /api/ {
        proxy_pass http://api_prod/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authoritative for is_legacy_host(): ProxyFix trusts one
        # forwarded host, so a client-supplied X-Forwarded-Host would
        # otherwise pick the legacy/v2 compatibility branch.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /api-test/ → Flask API (test-databas)
    # För Next.js frontend att växla till test-läge
    # ----------------------------------------
    location /api-test/ {
        proxy_pass http://api_test/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authoritative for is_legacy_host(): ProxyFix trusts one
        # forwarded host, so a client-supplied X-Forwarded-Host would
        # otherwise pick the legacy/v2 compatibility branch.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /stamboken/ → Next.js (herdbook dashboard)
    # ----------------------------------------
    location /stamboken/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ----------------------------------------
    # /admin → Next.js (Payload CMS admin)
    # ----------------------------------------
    location /admin {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Payload admin streams RSC/Suspense; buffering can blank the panel.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ----------------------------------------
    # /cms-api/ → Next.js (Payload REST API)
    # ----------------------------------------
    location /cms-api/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bare /v2 and /stamboken (no trailing slash) → dashboard
    location = /v2 {
        return 301 https://$host/stamboken/;
    }
    location = /stamboken {
        return 301 https://$host/stamboken/;
    }

    # /v2/* → /stamboken/* (redirect old URLs)
    location ~ ^/v2/(.*)$ {
        return 301 https://$host/stamboken/$1;
    }

    # Next.js static files
    location /_next/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js public folder images
    location /static/ {
        proxy_pass http://nextjs/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ----------------------------------------
    # /uppladdningar/ → Statiska filer
    # ----------------------------------------
    location /uppladdningar/ {
        alias /app/uppladdningar/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ----------------------------------------
    # / → Next.js (public CMS site + landing)
    # The legacy SPA is served on stamboken.sb.gotlandskaninen.se (block
    # below); the stamboken.gotlandskaninen.se vhost stays disabled until the
    # DNS cutover (see the DISABLED note above that block).
    # ----------------------------------------
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

