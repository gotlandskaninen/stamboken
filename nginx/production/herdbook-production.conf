# ============================================
# stamboken.sb.gotlandskaninen.se - LEGACY (interim host on the new server)
# Same as the stamboken.gotlandskaninen.se block; retired at the apex flip.
# ============================================
server {
    listen 443 ssl;
    server_name stamboken.sb.gotlandskaninen.se;

    ssl_certificate /etc/letsencrypt/live/stamboken.sb.gotlandskaninen.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stamboken.sb.gotlandskaninen.se/privkey.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    # Intyg (~1.1 MB PDF) laddas upp råa till /api/certificates/verify/ — nginx-standard 1 MB gav 413 (legacy-audit F1).
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Transitional staging host - keep out of search indexes until the apex flip.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # /api/ → Flask API (prod-databas)
    location /api/ {
        proxy_pass http://api_prod/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authoritative for is_legacy_host(): ProxyFix trusts one
        # forwarded host, so a client-supplied X-Forwarded-Host would
        # otherwise pick the legacy/v2 compatibility branch.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # CSP violation reports from the legacy SPA (see log_format csp_report)
    location = /csp-report {
        limit_except POST { deny all; }
        limit_req zone=csp_report burst=20 nodelay;
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        access_log /var/log/nginx/access.log csp_report;
        proxy_pass http://127.0.0.1:8099;
    }

    # / → Legacy frontend (prod branch)
    location / {
        root /etc/nginx/legacy-frontend-prod;
        try_files $uri $uri/ /index.html;
        # index.html pekar på hashade assets: tvinga omvalidering så en gammal kopia inte pekar på filer som inte finns (legacy-audit G6/F8).
        expires epoch;

        # add_header here replaces the server-level set, so it is repeated in full.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests; report-uri /csp-report" always;
        add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; report-uri /csp-report" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Cache för statiska assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            # No add_header here: it would drop the headers set in location /.
        }
    }
}

