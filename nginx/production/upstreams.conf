# Upstreams shared by every production vhost file.
#
# Own file with no certificate in it: jonasal/nginx-certbot sets a vhost file
# aside (.nokey) when one of its certificates is missing, and a vhost file
# that is still loaded must find these names, or nginx does not start at all.
# Mounted as 00-upstreams.conf so that it is read first.

upstream api_prod {
    server api:9090;
    keepalive 32;
}

upstream api_test {
    server api-test:9090;
    keepalive 32;
}

upstream nextjs {
    server next-app:3000;
    keepalive 32;
}
